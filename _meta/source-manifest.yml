note: |
  Every upstream source this corpus consumes. HAND-AUTHORED and human-approved via PR —
  deliberately not generated, because unlike every other corpus here there is no upstream
  index to walk. The federal government does not publish "the list of instruments Oregon
  must comply with"; that list is a judgement, so it is made explicitly and reviewed.

  Each entry records WHICH SIGNAL put it here, because the three disagree and the
  disagreement is the most useful thing we know:

    audited     cited in Oregon's single audits — what the state is audited AGAINST.
                The compliance surface, and the signal the original seed lacked.
    authority   claimed as legal authority by an Oregon rule (legal_authority or
                statutes_implemented in executive-regulatory-frameworks).
    named       high-stakes instrument named in the seed regardless of citation count.

  The rankings barely overlap. 2 CFR 200 leads `audited` at 180 citations while drawing only
  15 authority claims (1.6% of ERF's 916); 29 CFR 1910 leads prose mentions across ERF and
  has no authority claims at all. Ranking intake by what Oregon RULES cite would have put IDEA first and never
  reached the Uniform Guidance, which binds every federal dollar the state receives.

  VERSIONS ARE PART OF IDENTITY, not metadata, for anything publishing discrete versions.
  Requirements change between revisions, so resolving a 2019 citation to 2026 text is a
  wrong answer wearing a right answer's clothes. Where Oregon cites versions we do not hold,
  the entry says so rather than letting the current one quietly stand in.

  `format` is declared on every entry, per the template's warning. It matters more here than
  usual: the eCFR URL ends in `?part=200`, so an inferred format would be html, and drift
  detection would run an HTML-to-text converter over XML and report a change every run.

  `issuing_body` is REQUIRED on every `cfr_part` entry — the promulgating agency, SPELLED OUT
  in full, matching every issuer already in this file ("Office of Management and Budget", not
  "OMB"; "Internal Revenue Service", not "IRS"): e.g. "Department of Justice" for 28 CFR 35 or
  "Department of Health and Human Services / Substance Abuse and Mental Health Services
  Administration" for 42 CFR 2, not "DOJ" or "HHS/SAMHSA". This field is served over MCP as
  provenance a reader may cite; nothing normalizes or expands an abbreviation downstream, so
  an abbreviated entry here is a permanent inconsistency, not a display shortcut. It is a fact
  about the SPECIFIC part, not the kind: OMB issues 2 CFR 200 but not every CFR part, so it
  cannot be inferred from `instrument_kind` the way it can for the other three kinds.
  ingest_instruments.py fails loudly, naming the entry, if a cfr_part omits it. See #33.

index: "https://www.ecfr.gov/"
recheck: quarterly

sources:
  - id: "2-cfr-200"
    url: "https://www.ecfr.gov/api/versioner/v1/full/2026-07-29/title-2.xml?part=200"
    format: "xml"
    instrument_kind: "cfr_part"
    citation: "2 CFR 200"
    title: "Uniform Administrative Requirements, Cost Principles, and Audit Requirements for Federal Awards"
    # issuing_body: required per cfr_part, spelled out in full -- see the `note:` at the top
    # of this file for the convention and why. See #33.
    issuing_body: "Office of Management and Budget"
    signal: "audited"
    why: >
      The Uniform Guidance. Governs every federal grant Oregon receives. Cited 180 times in
      Oregon's single audits and declared as legal authority by 15 Oregon documents — the
      clearest case that compliance obligations far outrun the rules that point at them.
      (An earlier revision of this file said ZERO authority claims; that was a misreading of
      the citation catalog's `resolves: False` field and is corrected here.)
    reproduction_basis: "17 U.S.C. § 105 — edition of the CFR published by the U.S. government"
    sha256: "2eec240fe32106328b66320aa9beb57afa7f07cac7447a72453cf74718e82510"
    notes: >
      180 sections, 6 subparts, 12 appendices. Title 2 last amended 2026-07-16. eCFR is a
      point-in-time API, so this URL pins the as-of date explicitly rather than meaning
      "whatever is current when you happen to fetch". Sections are ## anchors in the part
      document; the 29 Oregon actually cites become their own documents in Stage 1b.

  - id: "34-cfr-300"
    url: "https://www.ecfr.gov/api/versioner/v1/full/2026-08-28/title-34.xml?part=300"
    format: "xml"
    instrument_kind: "cfr_part"
    citation: "34 CFR 300"
    title: "Assistance to States for the Education of Children With Disabilities"
    issuing_body: "Department of Education"
    signal: "authority"
    why: >
      IDEA Part B — special education. `_meta/ingest-queue.yml` ranks 574 unheld CFR parts
      by Oregon authority claim; this is rank 1 at 105 authority claims and 129 mentions,
      three times the next-ranked part (7 CFR 273 at 33 claims) and the largest unheld part
      in the corpus by a wide margin. #63's own measurement found none of the four parts
      curated by hand in #22 through #25 carried a single authority claim, while this part
      appeared in none of them — the first ingest chosen by measurement rather than by
      curation. issuing_body is the Department of Education, not the Office of Management
      and Budget: #33 exists because that field was hardcoded to OMB, and this is the first
      part ingested since that fix that proves a cfr_part entry states its own issuer.
    reproduction_basis: "17 U.S.C. § 105 — edition of the CFR published by the U.S. government"
    sha256: "60a6d170bfd53bc68ebb38286d34245977e886dd3662fc33f7c8a20995e36d6b"
    notes: >
      288 sections, 8 subparts, 6 appendices. Title 34 last amended 2026-07-24; this part's
      own last amendment is 2017-08-10 (read from the part's own version record, not the
      title's -- see ingest_instruments.py's cfr_amended_on() docstring for why the two
      differ). eCFR is a point-in-time API, so this URL pins the as-of date explicitly.
      Sections Oregon actually cites become their own documents per ADR-0003, derived by
      src/scan_cited_sections.py --title 34 --part 300.

