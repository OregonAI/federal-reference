name: scheduled
on:
  schedule:
    - cron: "0 14 * * 1"      # weekly Monday; tighten per corpus cadence
  workflow_dispatch:

jobs:
  drift:
    permissions:
      contents: write
      issues: write
    uses: OregonAI/corpus-toolkit/.github/workflows/detect-upstream-changes.yml@v1.30.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.30.0

  # FULL-CORPUS validation. ci.yml only ever validates files CHANGED in a PR,
  # which leaves two real holes:
  #
  #   1. A document merged before a rule tightened is never re-checked, and a
  #      document whose snapshot is later deleted is never re-detected.
  #   2. On a repository's FIRST push to main, github.event.before is all-zeros,
  #      so the changed-file set is empty and validation passes having checked
  #      nothing. An initial bulk import can land fully green and completely
  #      unvalidated — the single worst moment to not be looking.
  #
  # The toolkit's reusable workflows already branch on github.event_name and run
  # the full corpus for schedule/workflow_dispatch; without these two jobs that
  # branch is dead code in every corpus built from this template.
  full-frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1.30.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.30.0
  full-provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1.30.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.30.0

  # OUR OWN links, the ones ci.yml's lychee exclusion deliberately skips. Network-dependent,
  # so weekly rather than per-PR.
  source-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 src/check_source_urls.py

  # POPULATE THE DRIFT BASELINE, on demand.
  #
  # corpus-detect-changes compares a fresh fetch against `sha256:` in the manifest. Those
  # shipped EMPTY, so every source reported CHANGED on every weekly run — the only
  # upstream-content guard this corpus has was a 100% false positive, which is the same as
  # having no guard.
  #
  # It lives here rather than in the ingester because the hash for a PDF is whatever
  # `pdftotext` produces, and poppler is not present on a normal dev machine. Writing a hash
  # computed by any other function would swap one permanent false positive for another while
  # looking fixed.
  #
  # Manual, not scheduled: recording a new baseline is how you ACCEPT an upstream change, and
  # that is a decision a person makes after looking at the diff, not something a cron should
  # do quietly on a corpus of federal requirements.
  refresh-source-hashes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 src/refresh_source_hashes.py
      - name: Commit any change
        run: |
          if [ -n "$(git status --porcelain _meta/source-manifest.yml)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _meta/source-manifest.yml
            git commit -m "Record drift baseline hashes for manifest sources"
            # The `drift` job in this same workflow commits its own STATUS.md repair to the
            # same branch, so the two race and whichever pushes second is rejected. Rebase
            # onto whatever landed first rather than failing the run.
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "manifest hashes already current"
          fi
