name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1
  provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1
  links:
    uses: OregonAI/corpus-toolkit/.github/workflows/check-links.yml@v1
    with:
      # lychee walks './**/*.md'. Without these exclusions it crawls
      # _meta/templates/document.md — a skeleton whose example URLs are not meant
      # to resolve — and every PR fails on link rot that is not link rot.
      # _meta/snapshots/ is excluded because a large corpus's snapshots would drag
      # hundreds of upstream URLs into a per-PR gate; upstream availability is what
      # the scheduled drift job is for.
      # `instruments/` is excluded because its links are NOT this repository's links.
      #
      # Every document's `## Full text` is verbatim federal text, and federal documents cite
      # URLs constantly. Measured on the first run: 72 links checked, 14 errors, ALL of them
      # inside instruments/ — NIST drafts and third-party articles the FBI cited in the CJIS
      # policy years ago (kernelthread.com, windowsecurity.com). A 2016 publication citing a
      # page that died in 2019 is an accurate copy, not link rot in this corpus, and
      # "fixing" one would mean editing federal text, which is the one thing a corpus whose
      # doc_type asserts verbatim reproduction must never do.
      #
      # THE LINKS THAT ARE OURS ARE STILL CHECKED, just not here — by
      # src/check_source_urls.py in scheduled.yml, which fetches every distinct frontmatter
      # source_url and exits non-zero on any failure.
      #
      # That sentence used to name the `drift` job instead, and it was FALSE:
      # corpus-detect-changes iterates the five MANIFEST sources and never opens a document.
      # Once the section split landed, 28 of our own source_urls were checked by nothing at
      # all while this comment said they were covered. Verified before excluding: none of our
      # source_urls appear among the 14 in-document failures.
      exclude-paths: |
        _meta/snapshots
        _meta/templates
        instruments

  # EVERY COMMITTED GENERATED ARTIFACT MUST BE CURRENT, checked on every PR.
  #
  # This is the gate the toolkit cannot provide for you. It only READS
  # _meta/graph.json, so nothing upstream notices when a document is added and the
  # graph is not rebuilt — resolve_citation and graph_neighbors simply stop finding
  # it, silently, with no error anywhere.
  #
  # What this corpus commits, and what covers it:
  #
  #   _meta/graph.json        src/build_graph.py               this job, every PR
  #   STATUS.md               corpus-generate-status           this job, every PR
  #   _meta/ingest-queue.yml  src/scan_cited_sections.py        this job, every PR
  #                           (--check only; the scan itself needs the sibling ERF
  #                           checkout CI cannot reach -- see that script's own docstring
  #                           and check_queue()'s, and check_ingest_queue.py below for the
  #                           synthetic-fixture proof that the ranking algorithm is sound)
  #
  # STATUS.md is also regenerated and committed by the weekly `drift` job in
  # scheduled.yml. That is a repair, not a gate: between Mondays a PR can merge a
  # document and leave the published status wrong for six days with nothing saying so.
  #
  # _meta/corpus-index.json is deliberately ABSENT from this list. The platform builds
  # it at deploy time in publish-index.yml and never commits it, precisely so it cannot
  # fall behind its own corpus in a way that damages a SIBLING repo's citation
  # resolution. Do not commit one and then gate it here; publish it instead.
  #
  # ADD A STEP HERE FOR EVERY GENERATED FILE YOU COMMIT. A generated file with no step
  # is the failure this whole job exists to prevent, and it is silent by construction.
  #
  # Note the checks are `--check` rather than `git diff --exit-code`: STATUS.md carries
  # a "Generated <date>" line, so a raw diff would fail every day for a reason that is
  # not drift. Both `--check` implementations compare CONTENT and print the exact
  # command to re-run.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # src/ scripts need pypdf (pinned) as well as the toolkit — check_extraction.py
      # re-reads the raw PDFs, and ingest_instruments.py imports it at module load.
      - run: pip install -r requirements.txt
      - name: Section anchors must be current
        run: python3 src/anchor_sections.py --check
      - name: Authority graph must be current
        run: python3 src/build_graph.py --check
      - name: STATUS.md must be current
        run: corpus-generate-status --config _meta/corpus.yml --output STATUS.md --check
      # Every _meta/cited-sections/<part>.yml says "GENERATED -- do not hand-edit" and its
      # section documents are generated from it, but nothing compared them: edit either side
      # and CI stayed green. --check also reports ORPHANs, so a hand-added section document
      # or one left behind by a dropped citation is caught too. #34: with no --part-id this
      # now checks EVERY part with a committed cited-sections file, not only 2 CFR 200.
      - name: Split CFR sections must match the citation list
        run: python3 src/split_cfr_sections.py --check
      # split_cfr_sections.py --check above is a no-regression check on the FIRST part (2 CFR
      # 200) -- it reads the same whether the splitter, the scanner's regexes, and the
      # provenance slicer still assume there is only one part, because 2 CFR 200 is that one
      # part either way. #34's queued second instrument (6 CFR 37) is not ingested yet, so
      # this is the gate that actually proves a SECOND part, the same reason
      # check_issuing_body.py exists below for #33.
      - name: A second cfr_part must split, slice, and link independently of the first
        run: python3 src/check_section_split.py
      # #63: _meta/ingest-queue.yml says "GENERATED -- do not hand-edit" the same way
      # _meta/cited-sections/<part>.yml does, and was completely ungated before this line
      # existed. THIS DOES NOT RE-RANK FROM ERF's real catalog -- that needs a sibling
      # checkout CI does not have (see scan_cited_sections.py's module docstring). What it
      # verifies here: the committed file's header is current, its `queue:` is correctly
      # sorted and internally consistent with its own declared totals, and -- the one fact
      # checkable without a sibling checkout -- no part it lists as unheld is actually held
      # in THIS corpus's instruments/ right now. See check_queue()'s own docstring for the
      # full scope decision and why a fuller re-derivation stays a developer-machine step.
      # --erf/--audits are required flags on the CLI shared with the scanning modes above,
      # but --check reads neither path (see check_queue()'s docstring) -- `.` is a
      # placeholder that satisfies `is_dir()`, not a real sibling checkout.
      - name: Ingest queue must match its own header and this corpus's held parts
        run: python3 src/scan_cited_sections.py --erf . --audits . --check
      # The check above proves the COMMITTED file hasn't rotted; it does not exercise the
      # RANKING ALGORITHM itself (claims-desc sort, mentions carried without being dropped
      # at zero claims, held-part exclusion) against more than the one fixed real answer.
      # This is that proof, against a synthetic catalog and a synthetic instruments/ --
      # the same reason check_section_split.py exists for the splitter (#34) and
      # check_issuing_body.py exists below for the issuer resolver (#33).
      - name: Part-discovery ranking must sort by claim and exclude held parts
        run: python3 src/check_ingest_queue.py
      # Every other check here verifies documents are well-formed. This one verifies the
      # server does not give a CONFIDENT WRONG ANSWER — CJIS 6.1 returned for a 5.9.4
      # citation, current text returned for a superseded section, a public law returned for
      # a U.S. Code section. Those look correct and would be acted on. Mostly negative
      # assertions, each confirmed to fail when the behaviour it guards is removed.
      - name: Citation resolution must refuse what it cannot answer
        run: python3 src/check_citations.py
      # resolve_issuing_body() dispatches `cfr_part` to a per-source manifest read instead of
      # a per-kind constant (#33), specifically so a second part is not stamped with the
      # first's issuer. Nothing else exercises a SECOND part through it: ingest_instruments.py
      # runs in no workflow, and #33's own evidence (2 CFR 200 regenerating byte-identically)
      # is a no-regression check on the FIRST part, which reads the same whether the bug is
      # fixed or not. This is the one gate that actually proves the second part.
      - name: A second cfr_part must not inherit the first part's issuer
        run: python3 src/check_issuing_body.py
      # #77: ingest_instruments.py had no gate on PART documents at all -- split_cfr_sections.py
      # --check above only ever looked at the SECTION documents split out of a part (#78's own
      # fix). A wholly superseded part (45 CFR 75, removed from the CFR entirely 2025-10-01)
      # would have been republished `status: current` on the next re-ingest, with nothing here
      # to notice. ingest_instruments.py itself runs in no workflow (see the comment two checks
      # up) and its own new `--check` flag needs a live eCFR lookup for every part NOT already
      # superseded, so it cannot be this gate for the corpus as a whole. This is the hermetic
      # proof instead, against synthetic fixtures and 45 CFR 75's real, already-committed
      # snapshot -- same shape as check_issuing_body.py and check_section_split.py, same
      # reason: mostly negative assertions, several confirmed to fail (a real one, `git log`
      # has no trace of it because it was applied and reverted by hand during review) when
      # build()'s status/superseded_by threading is reverted to the pre-#77 hardcode.
      - name: A wholly superseded part must not be republished as current
        run: python3 src/check_part_supersession.py
      # #77 review (S4): the ONE part this gate above cannot exercise is `main()` itself --
      # `check_part_supersession.py` calls `existing_supersession()`/`build()` directly, and a
      # refactor that dropped the two kwargs at the real call site (main():~1246) would leave
      # every other gate green. Unlike the corpus-wide `--check` above, `--only 45-cfr-75` IS
      # hermetic: it is already `status: superseded`, so `existing_supersession()` trusts the
      # committed `amended_on` instead of a live eCFR lookup, and `fetch()` reads the snapshot
      # already committed at `_meta/snapshots/45-cfr-75.xml` -- confirmed to need no network
      # and write nothing (`git status --porcelain` clean before and after).
      - name: main() itself must not republish 45 CFR 75 as current
        run: python3 src/ingest_instruments.py --check --only 45-cfr-75
      # `instrument_kind` is a bare `mcp.extra_document_fields` entry -- corpus-toolkit's
      # schema layer has no enum mechanism for an extra field's values (#56). A document
      # spelled "CFR_PART" instead of "cfr_part" is schema-valid, sits in instruments/,
      # is served by get_document/search_corpus, and is refused BY NAME when cited because
      # `_held_cfr_parts()` gates on the exact literal. This closes that one field over
      # from #35.
      - name: instrument_kind must be one of the known values
        run: python3 src/check_instrument_kind.py
      # corpus-verify-provenance CANNOT catch extraction loss: source_sha256 hashes the
      # committed .txt, and that .txt is written by the extractor from the same string that
      # goes into the document, so the whole chain compares the extractor against itself.
      # CJIS SP 6.1 shipped with a year and a standard number deleted while five checks were
      # green. This one re-reads the raw PDF/XML.
      - name: Committed text must match the raw source
        run: python3 src/check_extraction.py
      # #104: `split_cfr_sections.py --check` above verifies the SECTION side of the
      # part<->section edge pair (every split section's own `related: [<part_id>]`); nothing
      # verified the reverse, so a part whose cited-sections file grew after its last
      # `ingest_instruments.py` run became a graph dead end reachable only downward from its
      # sections, never upward from the part. 9 real parts were found in that state.
      - name: A cfr_part must list every one of its own split sections
        run: python3 src/check_part_edges.py
      # #102: the extraction guard used to be a flat `len(text) < 2000` applied to every
      # instrument_kind, which rejected a genuinely short but fully-extracted cfr_part
      # (7 CFR 280, one section, 1,554 chars) as "scanned or broken". ingest_instruments.py
      # itself runs in no workflow (see the comment above `check_extraction.py`'s own step),
      # so this is the hermetic, synthetic-fixture proof, same shape as check_issuing_body.py.
      - name: A short-but-structured cfr_part must not be flagged as scanned or broken
        run: python3 src/check_extraction_guard.py
      # #111: `ingest_instruments.py --check` reported pl-113-128, pl-115-224 and
      # irs-pub-1075 as drifted when nothing had -- it compared a fresh, UNANCHORED
      # extraction to the committed, ANCHORED document, for the three ids anchor_sections.py
      # re-anchors after every real ingest. Only `--check --only <id>` runs in this job (the
      # three steps below, and `--only 45-cfr-75` above) -- the corpus-wide `--check` does
      # not, because it needs a live eCFR lookup for every part not already superseded. This
      # step is the hermetic, synthetic-fixture proof for the fix itself, same shape as
      # check_issuing_body.py; the three steps below are the real path, same shape as
      # `--only 45-cfr-75` above.
      - name: ingest_instruments.py --check must compare against the anchored document
        run: python3 src/check_check_anchoring.py
      # Review finding (reingest-drifted-instruments): the step above is a synthetic proof
      # of the fix's mechanics; it never calls `ingest_instruments.py` itself, so a revert of
      # the ingester's own `anchored_md()` call would leave it green. These three run the
      # real path `--check --only 45-cfr-75` already establishes is hermetic for this job:
      # each of pl-113-128, pl-115-224 and irs-pub-1075 is a committed RULES snapshot read
      # from `_meta/snapshots/`, so no network and no write (`git status --porcelain` clean
      # before and after). `--only` takes exactly one id -- a comma-separated list fails with
      # "no manifest source with id" -- hence three steps, not one.
      - name: main() itself must not re-flag pl-113-128 as drifted
        run: python3 src/ingest_instruments.py --check --only pl-113-128
      - name: main() itself must not re-flag pl-115-224 as drifted
        run: python3 src/ingest_instruments.py --check --only pl-115-224
      - name: main() itself must not re-flag irs-pub-1075 as drifted
        run: python3 src/ingest_instruments.py --check --only irs-pub-1075
      # #111 step 3 ("decide whether CI should run the full --check"), recorded where a
      # future reader will see it: the corpus-wide `ingest_instruments.py --check` stays
      # out of this job, not just for now. It needs a live eCFR lookup per part (no `--only
      # <id>` hermetic shortcut at that scale), it is not write-free (fetch() caches raw
      # bytes for any source with no snapshot yet -- re-measured 2026-10-01: 49 matched /
      # 14 mismatched on main, 57/6 on this branch, and either run leaves 4 untracked
      # `_meta/snapshots/*.html` files for sources with no document at all), and per-PR it
      # would also flag every part whose `amended_on` moved since the PR branched, which is
      # not this PR's drift. Proposed instead: a scheduled job, separate from `pull_request`
      # and `push`, that runs the full `--check` and reports results to an issue. Recording
      # the proposal, not deciding it -- an operator still has to stand the job up.

  # #54: CONTRIBUTING.md requires an `Assisted-by:` trailer on agent-assisted commits, and
  # nothing checked for it -- "a check that passes without checking anything", per AGENTS.md's
  # own defect list. This job runs on `pull_request` ONLY, never on `push` to main: this
  # repo's squash-merge setting (`squash_merge_commit_message: COMMIT_MESSAGES`) reliably
  # breaks `git interpret-trailers --parse`'s reading of the trailer block on the commit that
  # lands on main -- confirmed against six real agent-assisted squash-merges already on main,
  # every one of them, regardless of whether the branch commit was well-formed. See
  # src/check_commit_trailers.py's own module docstring for the full investigation. Checking
  # the branch commits here, before GitHub touches them, is the only seam that can fail
  # honestly -- a gate on the post-merge commit would redden on every future agent-assisted PR
  # whether or not the author did anything wrong.
  commit-trailers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Every agent-assisted commit in this PR must carry a parseable Assisted-by: trailer"
        env:
          TRAILER_CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRAILER_CHECK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 src/check_commit_trailers.py
